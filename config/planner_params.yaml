/**:
  ros__parameters:
    use_dijkstra: false
    publish_searched_map: false
    update_path_weight: 0.05
    smooth_path_weight: 0.8
    iteration_delta_threshold: 1.e-6
    # Cells with cost > lethal_cost_threshold are obstacles (0-100 traversable).
    lethal_cost_threshold: 100
    # Added to g-cost per cell so A* prefers lower-cost regions.
    traversal_cost_weight: 1.0
    robot_radius: 0.1
